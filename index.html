<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>یادبود زنده‌یاد فتانه آقاجان‌پور</title>
    
    <style>
        @font-face {
            font-family: 'MemorialFont';
            src: url('font.woff2') format('woff2');
            font-display: swap;
        }

        :root {
            --bg-base: #06090e;
            --liquid-glass-bg: rgba(255, 255, 255, 0.04);
            --liquid-glass-border: rgba(255, 255, 255, 0.16);
            --liquid-inner-light: rgba(255, 255, 255, 0.45);
            --accent-gold: #e5c07b;
            --accent-glow: rgba(229, 192, 123, 0.22);
            --text-primary: #f5f7fa;
            --text-secondary: #a0aec0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'MemorialFont', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
            position: relative;
            overflow-x: hidden;
        }

        /* لایه‌های مایع درخشان و شناور پس‌زمینه برای ایجاد شکست نور شیشه‌ای */
        .ambient-sphere {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            pointer-events: none;
            opacity: 0.55;
            animation: floatAmbient 14s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
        }

        .sphere-1 {
            width: 380px;
            height: 380px;
            background: radial-gradient(circle, #384c7a, transparent 70%);
            top: -60px;
            right: -60px;
        }

        .sphere-2 {
            width: 340px;
            height: 340px;
            background: radial-gradient(circle, #5e3b5e, transparent 70%);
            bottom: -50px;
            left: -50px;
            animation-duration: 18s;
        }

        .sphere-3 {
            width: 260px;
            height: 260px;
            background: radial-gradient(circle, rgba(229, 192, 123, 0.18), transparent 70%);
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        @keyframes floatAmbient {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(25px, 35px) scale(1.12); }
        }

        /* کانتینر اصلی Liquid Glass اپل */
        .liquid-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
            backdrop-filter: blur(35px) saturate(210%);
            -webkit-backdrop-filter: blur(35px) saturate(210%);
            border: 1px solid var(--liquid-glass-border);
            border-radius: 40px;
            padding: 30px 22px;
            box-shadow: 
                0 30px 80px rgba(0, 0, 0, 0.6),
                inset 0 1px 1px 0 var(--liquid-inner-light),
                inset 0 -1px 1px 0 rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .header-content {
            text-align: center;
        }

        .bismillah {
            font-size: 0.95rem;
            color: var(--accent-gold);
            letter-spacing: 1px;
            margin-bottom: 8px;
            opacity: 0.9;
        }

        .memorial-name {
            font-size: 1.55rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            text-shadow: 0 4px 15px rgba(255, 255, 255, 0.15);
        }

        .memorial-subtitle {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* قاب اختصاصی ویدیو عمودی ۹:۱۶ با حاشیه شیشه‌ای صیقلی */
        .video-container {
            position: relative;
            width: 100%;
            max-width: 290px;
            aspect-ratio: 9 / 16;
            border-radius: 28px;
            overflow: hidden;
            background: #000;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 
                0 20px 45px rgba(0, 0, 0, 0.5),
                inset 0 0 1px 1px rgba(255, 255, 255, 0.2);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            outline: none;
            background: #000;
        }

        /* پنل متن یادبود شیشه‌ای */
        .memorial-text-card {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 16px 20px;
            text-align: center;
            line-height: 1.8;
            font-size: 0.9rem;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .memorial-note {
            display: block;
            margin-top: 6px;
            font-size: 0.82rem;
            color: var(--accent-gold);
        }

        /* دکمه صلوات شیشه‌ای کپسولی */
        .action-area {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .pill-button {
            width: 100%;
            max-width: 280px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.04) 100%);
            border: 1px solid rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            color: #ffffff;
            padding: 14px 22px;
            border-radius: 100px;
            font-size: 0.95rem;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 
                0 12px 30px rgba(0, 0, 0, 0.35),
                inset 0 1px 1px rgba(255, 255, 255, 0.35),
                0 0 20px var(--accent-glow);
            transition: transform 0.15s ease, background 0.2s ease;
        }

        .pill-button:active {
            transform: scale(0.96);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.18) 0%, rgba(255, 255, 255, 0.08) 100%);
        }

        .counter-badge {
            background: var(--accent-gold);
            color: #0d0f14;
            font-weight: 700;
            padding: 3px 12px;
            border-radius: 50px;
            font-size: 0.85rem;
            min-width: 32px;
            text-align: center;
        }

        .status-caption {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .domain-tag {
            font-size: 0.72rem;
            color: rgba(255, 255, 255, 0.35);
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <!-- شکست نور مایع در پس‌زمینه -->
    <div class="ambient-sphere sphere-1"></div>
    <div class="ambient-sphere sphere-2"></div>
    <div class="ambient-sphere sphere-3"></div>

    <!-- بدنه شیشه‌ای -->
    <main class="liquid-card">
        
        <header class="header-content">
            <p class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</p>
            <h1 class="memorial-name">زنده‌یاد فتانه آقاجان‌پور</h1>
            <p class="memorial-subtitle">گرامی‌باد یاد و خاطره جاودانه‌اش</p>
        </header>

        <!-- کادر عمودی ۹:۱۶ با نمایش فریم اول به عنوان پوستر -->
        <div class="video-container">
            <video controls preload="metadata" playsinline>
                <source src="video.mp4#t=0.001" type="video/mp4">
                مرورگر شما امکان پخش ویدیو را ندارد.
            </video>
        </div>

        <section class="memorial-text-card">
            <p>مادرم رفت و نگاهش تا ابد در خانه ماند<br>مهربانی‌های او بر صفحه پروانه ماند...</p>
            <span class="memorial-note">جهت شادی روح پاکش، با قرائت فاتحه و صلوات یادش را گرامی بدارید.</span>
        </section>

        <section class="action-area">
            <button class="pill-button" id="salawatBtn" onclick="registerSalawat()">
                <span>ارسال صلوات و فاتحه</span>
                <span class="counter-badge" id="salawatCount">۰</span>
            </button>
            <p class="status-caption" id="statusHint">با لمس کلید، نیت شما ثبت می‌شود</p>
        </section>

        <footer class="domain-tag">fattanehaghajanpour.ir</footer>

    </main>

    <script>
        function toPersianDigits(value) {
            const digits = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
            return value.toString().replace(/\d/g, match => digits[match]);
        }

        let totalSalawat = parseInt(localStorage.getItem('user_salawat_count') || '0', 10);
        const countDisplay = document.getElementById('salawatCount');
        const hintDisplay = document.getElementById('statusHint');

        countDisplay.innerText = toPersianDigits(totalSalawat);

        function registerSalawat() {
            totalSalawat += 1;
            localStorage.setItem('user_salawat_count', totalSalawat);
            countDisplay.innerText = toPersianDigits(totalSalawat);

            if (navigator.vibrate) {
                navigator.vibrate(30);
            }

            hintDisplay.innerText = "ذکر شما ثبت شد؛ روحشان قرین رحمت الهی";
            hintDisplay.style.color = "var(--accent-gold)";
        }
    </script>
</body>
</html>
