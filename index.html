<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>یادبود زنده‌یاد فتانه آقاجان‌پور</title>
    
    <style>
        /* اتصال به فونت اختصاصی آپلود شده در گیت‌هاب */
        @font-face {
            font-family: 'MemorialFont';
            src: url('font.woff2') format('woff2');
            font-display: swap;
        }

        :root {
            --bg-color: #0b0f17;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-sheen: rgba(255, 255, 255, 0.25);
            --accent-gold: #e5c07b;
            --accent-gold-glow: rgba(229, 192, 123, 0.25);
            --text-main: #f0f3f6;
            --text-muted: #9aa4b2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'MemorialFont', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 14px;
            position: relative;
            overflow-x: hidden;
        }

        /* حباب‌های نوری شناور پشت شیشه برای افکت Liquid Glass */
        .ambient-glow {
            position: fixed;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            filter: blur(90px);
            z-index: 0;
            pointer-events: none;
            opacity: 0.45;
            animation: floatGlow 12s ease-in-out infinite alternate;
        }

        .glow-1 {
            background: radial-gradient(circle, #2b3a67, transparent 70%);
            top: -50px;
            right: -50px;
        }

        .glow-2 {
            background: radial-gradient(circle, #483248, transparent 70%);
            bottom: -50px;
            left: -50px;
            animation-duration: 16s;
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 40px) scale(1.15); }
        }

        /* ظرف اصلی اپل با استایل Liquid Glass */
        .glass-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
            background: var(--glass-bg);
            backdrop-filter: blur(28px) saturate(180%);
            -webkit-backdrop-filter: blur(28px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 36px;
            padding: 28px 20px;
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.45),
                inset 0 1px 1px var(--glass-sheen);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
        }

        /* هدر و مشخصات */
        .memorial-header {
            text-align: center;
        }

        .bismillah {
            font-size: 0.95rem;
            color: var(--accent-gold);
            letter-spacing: 1px;
            margin-bottom: 8px;
            opacity: 0.9;
        }

        .name-title {
            font-size: 1.45rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.15);
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        /* قاب ویدیوی شیشه‌ای و مدرن */
        .video-wrapper {
            position: relative;
            width: 100%;
            border-radius: 24px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 
                0 15px 35px rgba(0, 0, 0, 0.35),
                inset 0 0 15px rgba(255, 255, 255, 0.03);
            aspect-ratio: 16 / 9;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            outline: none;
        }

        /* کادر شعر و متن یادبود */
        .poem-card {
            background: rgba(255, 255, 255, 0.025);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 16px 18px;
            text-align: center;
            width: 100%;
            line-height: 1.85;
            font-size: 0.88rem;
            color: #d6dce5;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        /* دکمه تعاملی صلوات و فاتحه (Apple Frosted Pill) */
        .counter-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .salawat-btn {
            background: linear-gradient(135deg, rgba(229, 192, 123, 0.15), rgba(255, 255, 255, 0.05));
            border: 1px solid rgba(229, 192, 123, 0.35);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #fff;
            padding: 14px 28px;
            border-radius: 50px;
            font-size: 0.95rem;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: 
                0 10px 25px rgba(0, 0, 0, 0.25),
                0 0 15px var(--accent-gold-glow);
            width: 100%;
            max-width: 290px;
            justify-content: center;
        }

        .salawat-btn:active {
            transform: scale(0.96);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            background: linear-gradient(135deg, rgba(229, 192, 123, 0.25), rgba(255, 255, 255, 0.1));
        }

        .counter-badge {
            background: var(--accent-gold);
            color: #1a160c;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.88rem;
            min-width: 32px;
            text-align: center;
        }

        .hint-text {
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 0.2px;
        }

        /* فوتر ظریف */
        .footer {
            font-size: 0.72rem;
            color: rgba(255, 255, 255, 0.3);
            margin-top: -6px;
        }
    </style>
</head>
<body>

    <!-- افکت‌های نور پس‌زمینه (Liquid Ambient) -->
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <!-- بدنه شیشه‌ای کارت -->
    <div class="glass-container">
        
        <header class="memorial-header">
            <div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
            <h1 class="name-title">زنده‌یاد فتانه آقاجان‌پور</h1>
            <p class="subtitle">گرامی‌باد یاد و خاطره جاودانه‌اش</p>
        </header>

        <!-- بخش ویدیو بدون عکس (پلیر استاندارد و سبک) -->
        <div class="video-wrapper">
            <video controls preload="none" playsinline>
                <source src="video.mp4" type="video/mp4">
                مرورگر شما از پخش ویدیو پشتیبانی نمی‌کند.
            </video>
        </div>

        <!-- متن و دل‌نوشته -->
        <div class="poem-card">
            مادرم رفت و نگاهش تا ابد در خانه ماند<br>
            مهربانی‌های او بر صفحه پروانه ماند...<br>
            <span style="color: var(--accent-gold); font-size: 0.8rem; display: block; margin-top: 6px;">
                نثار روح پاکش شاخه‌گلی با ذکر صلوات و فاتحه هدیه فرمایید.
            </span>
        </div>

        <!-- دکمه ارسالی صلوات/فاتحه شبیه دکمه‌های iOS -->
        <div class="counter-section">
            <button class="salawat-btn" id="salawatBtn" onclick="sendSalawat()">
                <span>🌸 ارسال صلوات و فاتحه</span>
                <span class="counter-badge" id="counterDisplay">۰</span>
            </button>
            <span class="hint-text" id="statusMsg">با لمس کلید، نیت شما ثبت می‌شود</span>
        </div>

        <div class="footer">
            fattanehaghajanpour.ir
        </div>

    </div>

    <script>
        // تبدیل اعداد به فارسی برای زیبایی فونت
        function toPersianDigits(n) {
            const farsiDigits = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
            return n.toString().replace(/\d/g, x => farsiDigits[x]);
        }

        // شمارنده ذخیره شونده در حافظه مرورگر فرد
        let count = parseInt(localStorage.getItem('user_salawat_count') || '0');
        const counterDisplay = document.getElementById('counterDisplay');
        const statusMsg = document.getElementById('statusMsg');

        counterDisplay.innerText = toPersianDigits(count);

        function sendSalawat() {
            count++;
            localStorage.setItem('user_salawat_count', count);
            counterDisplay.innerText = toPersianDigits(count);

            // لرزش ظریف شبیه آیفون در صورت پشتیبانی گوشی
            if (navigator.vibrate) {
                navigator.vibrate(35);
            }

            statusMsg.innerText = "ذکر شما ثبت شد، روحش شاد و قرین رحمت";
            statusMsg.style.color = "var(--accent-gold)";
        }
    </script>
</body>
</html>
